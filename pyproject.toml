[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simulateur-macro-politique"
version = "1.0.0"
description = "Simulateur macro-politique systémique — Démocratie et politique, du peuple, pour le peuple, par le peuple."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Loi 1901 — Open-Source et Privé" }
authors = [
    { name = "Thejmimiia", email = "thejmimiia@gmail.com" }
]
keywords = [
    "simulation", "politique", "économie", "démocratie",
    "élections", "budget", "dette", "UE", "macroéconomie",
    "systémique", "gigogne", "mandature", "démocratie",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Sociology :: Political Science",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
benchmark = [
    "pytest-benchmark>=4.0",
]

[project.scripts]
simulateur-mpol = "simulateur.cli:lancer_menu_interactif"
simulateur-mpol-run = "main:main"

[tool.setuptools]
packages = ["simulateur"]

[tool.setuptools.py-modules]
"main" = "main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
