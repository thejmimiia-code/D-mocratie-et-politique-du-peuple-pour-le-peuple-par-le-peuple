name: Captures d'écran

# Photographier la page dans un vrai navigateur, aux quatre largeurs et dans les
# quatre thèmes, et garder les images en artefact. Ce n'est pas un contrôle qui
# échoue : c'est une **mesure visuelle** — deux passes se comparent alors à
# l'œil, ce qu'aucun test de couleur ni budget d'octets ne remplace.
#
# Déclenché à la demande, et sur toute branche sauf `main` (une poussée sur
# `main` a déjà ses contrôles ; les images se demandent).

on:
  workflow_dispatch:
  push:
    branches-ignore: [main, master]

jobs:
  capturer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Puppeteer (Chromium compris)
        # Ni `package.json` ni `package-lock.json` ne sont versionnés ici : le
        # manifeste est créé dans le coureur, pour la durée du travail. Le
        # navigateur n'est pas une dépendance du paquet, c'est l'outil de la
        # photographie.
        run: |
          npm init -y > /dev/null
          npm install --no-save --no-audit --no-fund puppeteer@23

      - name: Servir la page en mode hors ligne
        run: |
          SIMULATEUR_HORS_LIGNE=1 python3 -m simulateur.dashboard --host 127.0.0.1 --port 8124 \
            > /tmp/serveur-captures.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8124/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8124/ | grep -q "Interface v" \
            || { echo "Le serveur ne sert pas la page attendue" ; cat /tmp/serveur-captures.log ; exit 1 ; }

      - name: Photographier
        run: node outils/captures_ecran.mjs --url http://127.0.0.1:8124/

      - name: Publier les captures
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecran
          path: captures/
          if-no-files-found: error
          retention-days: 30
