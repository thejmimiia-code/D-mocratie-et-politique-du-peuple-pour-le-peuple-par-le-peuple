name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify package installation
        run: |
          python -m pip install .
          simulateur-mpol-run --help

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check .

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run mandature simulation
        run: python3 main.py mandature

      - name: Run choc_mondial simulation
        run: python3 main.py choc_mondial

      - name: Run geopolitical scenarios (strate 5)
        run: |
          python3 main.py crise_taiwan
          python3 main.py hormuz
          python3 main.py escalade_nucleaire
          python3 main.py convergence_ww3
          python3 main.py resilience

      - name: Verify JSON export
        run: |
          python3 main.py mandature --export /tmp/smoke_test.json
          python3 -c "import json; data=json.load(open('/tmp/smoke_test.json')); assert data['nombre_etapes']==5; assert len(data['resultats'])==5; print('JSON export OK')"

      - name: Verify CSV export
        run: |
          python3 main.py mandature --export /tmp/smoke_test.csv
          python3 -c "import csv; rows=list(csv.DictReader(open('/tmp/smoke_test.csv'))); assert len(rows)==5; print(f'CSV export OK ({len(rows)} rows)')"

      - name: Verify WSGI entrypoint (hébergement en ligne)
        run: |
          python3 - <<'PY'
          import json, threading, urllib.request
          from wsgiref.simple_server import make_server
          from simulateur.wsgi import application

          serveur = make_server("127.0.0.1", 8123, application)
          threading.Thread(target=serveur.serve_forever, daemon=True).start()
          with urllib.request.urlopen("http://127.0.0.1:8123/api/lexique") as reponse:
              assert reponse.status == 200, reponse.status
              assert json.load(reponse)["total"] > 0
          serveur.shutdown()
          print("Point d'entrée WSGI OK")
          PY

      - name: Verify R&D import and chronological validation
        run: |
          python -m simulateur.import_ucdp --csv tests/fixtures/ged_schema_synthetique.csv --contrat tests/fixtures/contrat_ged_synthetique.json --sortie /tmp/rd-observations.jsonl --rapport /tmp/rd-import.json
          python -m simulateur.validation_temporelle --observations /tmp/rd-observations.jsonl --debut 2024-01-01 --fin 2024-06-01 --evaluation-au 2026-10-03 --unites UCDP_COUNTRY_101 --minimum 1 --sortie /tmp/rd-validation.json
          python -c "import json; r=json.load(open('/tmp/rd-validation.json')); assert r['predictions']==[]; assert len(r['abstentions'])==6; assert r['scores']['frequence_lissee']['brier'] is None"
