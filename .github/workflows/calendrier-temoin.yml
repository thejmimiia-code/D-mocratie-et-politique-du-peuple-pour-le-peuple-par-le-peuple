name: Témoin du calendrier

# **Sonde temporaire.** Elle ne fait qu'une chose : dire, à chaque passage, que
# GitHub a bien livré un événement `schedule`. Elle existe parce qu'une question
# restait sans réponse le 15 octobre 2026 : le garde-veille
# (`garde-veille.yml`) est programmé, `active`, sur la branche par défaut d'un
# dépôt public, actif, non archivé — et **aucun** passage `schedule` n'arrivait,
# une heure et demie après sa fusion.
#
# Réponse en dix minutes : soit le témoin passe, et le calendrier de GitHub
# fonctionne (le garde-veille, lui, attendait simplement son enregistrement) ;
# soit il ne passe pas, et aucune promesse de réveil périodique ne doit reposer
# sur cette horloge — c'est alors le pinger externe, ou le déclenchement par
# poussée, qui porte la garantie.
#
# Elle sera retirée une fois la réponse obtenue : un dépôt n'a pas besoin d'un
# témoin permanent.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  temoin:
    runs-on: ubuntu-latest

    steps:
      - name: Dire l'heure
        run: |
          echo "Témoin : un événement 'schedule' a été livré."
          echo "Instant : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Événement : ${{ github.event_name }}"
          {
            echo "## Témoin du calendrier"
            echo
            echo "Un événement **${{ github.event_name }}** est arrivé à"
            echo "$(date -u '+%Y-%m-%d %H:%M UTC')."
          } >> "$GITHUB_STEP_SUMMARY"
